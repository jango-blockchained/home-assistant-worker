name = "home-assistant-worker"
account_id = "profile"
main = "src/index.ts"
compatibility_date = "2024-07-08"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Remove D1 database bindings if they exist
# [[d1_databases]]
# binding = "DB" # i.e. available in your Worker on env.DB
# database_name = "hoox-tui-prod"
# database_id = "e4a5233f-63b7-4a7b-9399-7f58d3072994"

# Secrets managed via Cloudflare Secrets Store
secrets_store_secrets = [
  # { binding = "INTERNAL_SERVICE_KEY_SECRET", store_id = "<YOUR_STORE_ID>", secret_name = "D1_INTERNAL_SERVICE_KEY" } # Remove or comment out if not needed
  { binding = "INTERNAL_KEY_BINDING", store_id = "<YOUR_STORE_ID>", secret_name = "WEBHOOK_INTERNAL_KEY" } # <-- ADD THIS for internal auth
]

# Remove old comments
# # Secrets to be added with wrangler:
# # wrangler secret put INTERNAL_SERVICE_KEY 

[vars]
# Add other environment variables here if needed

# Define secrets for Home Assistant
# These must be created using `wrangler secret put <SECRET_NAME>`
# wrangler secret put HA_SECURE_URL
# wrangler secret put HA_TOKEN

# Example routes if needed
# [triggers]
# routes = [
# 	{ pattern = "home-assistant.yourdomain.com/*", zone_name = "yourdomain.com" },
# ] 